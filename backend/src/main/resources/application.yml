spring:
  application:
    name: estelya

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estelya}
    username: ${DB_USERNAME:estelya_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}